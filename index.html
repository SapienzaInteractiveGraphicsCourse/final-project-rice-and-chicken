<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimension Shift: Sci-Fi Arena</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-overlay">
        <h2>SYSTEM: ACTIVE</h2>
        <p>WAVE: <span id="wave-value">1</span> / <span id="wave-total">10</span></p>
        <p>MOVE: W, A, S, D / Arrows</p>
        <p>SHIFT DIMENSION: [TAB] (Coming soon)</p>
        <p id="strength-buff-line" class="hidden">STRENGTH BOOST: <span id="strength-buff-timer">15</span>s</p>
    </div>

    <div id="wave-banner"></div>

    <div id="boss-bar-container" class="hidden">
        <div id="boss-name"></div>
        <div id="boss-health-container">
            <div id="boss-health-fill"></div>
        </div>
    </div>

    <div id="hud-bottom-right">
        <div id="armor-row">
            <svg class="armor-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <path d="M12 2 L20 5 V11 C20 16.5 16.5 20.5 12 22 C7.5 20.5 4 16.5 4 11 V5 Z"/>
            </svg>
            <div id="armor-bar-container">
                <div id="armor-bar-fill"></div>
            </div>
            <span id="armor-value">0</span>
        </div>

        <div id="health-row">
            <svg class="health-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7V2z"/>
            </svg>
            <div id="health-bar-container">
                <div id="health-bar-fill"></div>
            </div>
            <span id="health-value">100</span>
        </div>

        <div id="weapon-select">
            <div class="weapon-box" id="weapon-box-0">
                <div class="weapon-icon" id="weapon-icon-0"></div>
                <div class="weapon-info">
                    <div class="weapon-name" id="weapon-name-0"></div>
                    <div class="weapon-key">[1]</div>
                </div>
            </div>
            <div class="weapon-box" id="weapon-box-1">
                <div class="weapon-icon" id="weapon-icon-1"></div>
                <div class="weapon-info">
                    <div class="weapon-name" id="weapon-name-1"></div>
                    <div class="weapon-key">[2]</div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over" class="hidden">
        <h1 class="game-over-title">SYSTEM OFFLINE</h1>
        <button id="restart-button" class="restart-button">RESTART</button>
    </div>

    <div id="victory-screen" class="hidden">
        <h1 class="victory-title">VICTORY</h1>
        <button id="victory-button" class="victory-button">PLAY AGAIN</button>
    </div>

    <div id="pause-menu" class="hidden">
        <h1 class="pause-title">PAUSED</h1>
        <div class="pause-buttons">
            <button id="resume-button" class="resume-button">RESUME</button>
            <button id="quit-button" class="quit-button">MAIN MENU</button>
        </div>
    </div>

    <div id="main-menu">
        <h1 class="game-title">
            <span class="title-scifi">DIMENSION</span><span class="title-pixel">SHIFT</span>
        </h1>

        <div class="class-select">
            <button class="class-arrow" id="class-prev" aria-label="Previous class">&#10094;</button>
            <div class="class-box">
                <div class="class-swatch" id="class-swatch"></div>
                <div class="class-name" id="class-name">ASSAULT</div>
            </div>
            <button class="class-arrow" id="class-next" aria-label="Next class">&#10095;</button>
        </div>

        <button id="play-button" class="play-button">PLAY</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
